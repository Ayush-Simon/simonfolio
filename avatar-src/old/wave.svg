  <g transform="translate(30 50)">
    <!-- hair (back) -->
        <!-- neck -->
    <rect class="skin ink" stroke-width="8" x="358" y="470" width="84" height="140"/>

    <!-- waving arm (group so it can be animated: transform-origin ≈ shoulder) -->
