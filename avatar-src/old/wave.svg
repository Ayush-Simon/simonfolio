    <circle class="skin ink" stroke-width="8" cx="268" cy="385" r="24"/>
    <circle class="skin ink" stroke-width="8" cx="532" cy="385" r="24"/>
    
    <!-- head -->
    <ellipse class="skin ink" stroke-width="8" cx="400" cy="368" rx="134" ry="142"/>

    <!-- face -->
    <ellipse cx="318" cy="414" rx="20" ry="13" fill="#FF4D2E" opacity=".22"/>
    <ellipse cx="482" cy="414" rx="20" ry="13" fill="#FF4D2E" opacity=".22"/>
