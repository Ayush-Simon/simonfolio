<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 140 780 780" width="780" height="780">
  <!-- guy version. TODO: tweak colours to match you — skin, hair, tee -->
  <defs>
    <style>
      .ink{stroke:#111;stroke-linecap:round;stroke-linejoin:round}
      .skin{fill:#C98E66}.hair{fill:#1E1A1A}.tee{fill:#1A1A1A}.acc{fill:#FF4D2E}
    </style>
  </defs>
  <g transform="translate(50 20)">
    <!-- floating notes -->
    <g transform="translate(690 230) rotate(10)">
      <path fill="none" class="ink" stroke-width="8" d="M16 -4 L16 -80 Q48 -66 42 -38"/>
      <ellipse class="acc ink" stroke-width="7" cx="0" cy="0" rx="20" ry="15" transform="rotate(-20)"/>
    </g>
    <g transform="translate(110 300) rotate(-12) scale(.8)">
      <path fill="none" class="ink" stroke-width="9" d="M16 -4 L16 -80 M60 -16 L60 -92 M16 -80 L60 -92"/>
      <ellipse class="acc ink" stroke-width="8" cx="0" cy="0" rx="20" ry="15" transform="rotate(-20)"/>
      <ellipse class="acc ink" stroke-width="8" cx="44" cy="-12" rx="20" ry="15" transform="rotate(-20 44 -12)"/>
    </g>

    <!-- head, nodding to the beat -->
    <g id="dj-head" transform="rotate(-6 400 560)">
            <rect class="skin ink" stroke-width="8" x="358" y="470" width="84" height="150"/>
      <ellipse class="skin ink" stroke-width="8" cx="400" cy="368" rx="134" ry="142"/>
      <ellipse cx="318" cy="438" rx="22" ry="13" fill="#FF4D2E" opacity=".25"/>
      <ellipse cx="482" cy="438" rx="22" ry="13" fill="#FF4D2E" opacity=".25"/>
      <g fill="none" class="ink" stroke-width="11">
        <path d="M336 390 Q352 370 368 390"/><path d="M432 390 Q448 370 464 390"/>
        <path d="M325 345 Q350 335 375 345"/><path d="M425 345 Q450 335 475 345"/>
      </g>
      <path fill="none" class="ink" stroke-width="6" d="M398 402 Q390 425 406 428"/>
      <path fill="#7A1F14" class="ink" stroke-width="7" d="M368 452 Q400 484 432 452 Z"/>
      <path class="hair ink" stroke-width="8" d="M268 352 C252 262 290 212 345 198 C368 168 428 162 462 186 C512 194 552 246 532 352 C524 316 514 296 498 284 C478 302 440 306 412 294 C386 308 344 308 318 292 C296 304 278 324 268 352 Z"/>
      <g fill="none" stroke="#3A3434" stroke-width="5" stroke-linecap="round"><path d="M352 222 Q390 210 420 236"/><path d="M430 206 Q470 214 486 250"/><path d="M318 248 Q338 232 362 240"/></g>
      <!-- headphones -->
      <path fill="none" class="ink" stroke-width="26" d="M256 360 C244 140 556 140 544 360"/>
      <path fill="none" stroke="#FF4D2E" stroke-width="7" stroke-linecap="round" d="M262 330 C258 165 542 165 538 330"/>
      <rect x="226" y="318" width="64" height="124" rx="28" fill="#111"/>
      <rect x="239" y="337" width="38" height="86" rx="17" class="acc"/>
      <rect x="510" y="318" width="64" height="124" rx="28" fill="#111"/>
      <rect x="523" y="337" width="38" height="86" rx="17" class="acc"/>
    </g>

    <!-- body / tee -->
    <path class="tee ink" stroke-width="8" d="M180 860 C180 660 250 590 400 590 C550 590 620 660 620 860 Z"/>
    <path class="skin ink" stroke-width="8" d="M352 592 Q400 650 448 592 Z"/>
    <circle cx="400" cy="680" r="32" class="acc"/>
    <circle cx="400" cy="680" r="20" fill="none" stroke="#1A1A1A" stroke-width="3"/>
    <circle cx="400" cy="680" r="7" fill="#1A1A1A"/>

    <!-- deck -->
    <rect x="110" y="745" width="580" height="170" rx="26" fill="#2A2A2A" class="ink" stroke-width="8"/>
    <ellipse cx="290" cy="795" rx="125" ry="36" fill="#111"/>
    <ellipse cx="290" cy="795" rx="90" ry="26" fill="none" stroke="#3A3A3A" stroke-width="3"/>
    <ellipse cx="290" cy="795" rx="60" ry="17" fill="none" stroke="#3A3A3A" stroke-width="3"/>
    <ellipse cx="290" cy="795" rx="30" ry="9" class="acc"/>
    <g fill="#F5F3EE" class="ink" stroke-width="5">
      <circle cx="470" cy="775" r="11"/><circle cx="510" cy="775" r="11"/><circle cx="550" cy="775" r="11"/><circle cx="640" cy="775" r="11"/>
    </g>
    <rect x="500" y="820" width="130" height="9" rx="4" fill="#111"/>
    <rect x="574" y="810" width="24" height="28" rx="5" class="acc ink" stroke-width="4"/>

    <!-- arms + hands on the deck -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#111" stroke-width="66" d="M240 700 Q236 775 300 792"/>
      <path stroke="#C98E66" stroke-width="50" d="M240 700 Q236 775 300 792"/>
      <path stroke="#111" stroke-width="66" d="M560 700 Q566 790 586 815"/>
      <path stroke="#C98E66" stroke-width="50" d="M560 700 Q566 790 586 815"/>
      <path stroke="#111" stroke-width="80" d="M250 672 L242 704"/>
      <path stroke="#1A1A1A" stroke-width="64" d="M250 672 L242 704"/>
      <path stroke="#111" stroke-width="80" d="M550 672 L558 704"/>
      <path stroke="#1A1A1A" stroke-width="64" d="M550 672 L558 704"/>
    </g>
    <!-- hand on the record -->
    <ellipse class="skin ink" stroke-width="7" cx="314" cy="790" rx="38" ry="26"/>
    <g fill="none" class="ink" stroke-width="5"><path d="M326 772 Q342 782 340 798"/><path d="M314 768 Q330 780 328 800"/></g>
    <!-- hand on the crossfader -->
    <ellipse class="skin ink" stroke-width="7" cx="588" cy="818" rx="30" ry="25"/>
    <g fill="none" class="ink" stroke-width="5"><path d="M574 806 Q586 820 578 834"/><path d="M590 802 Q602 818 594 836"/></g>
  </g>
</svg>
